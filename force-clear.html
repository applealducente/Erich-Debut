<!DOCTYPE html>
<html>
<head>
  <title>Force Clear Firebase</title>
  <style>
    body { background: #09100b; color: #f8e3b5; font-family: Arial; padding: 40px; }
    button { background: #c5a25f; color: #171008; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; }
    button:hover { background: #d4b86f; }
    .log { background: rgba(0,0,0,.5); padding: 20px; border-radius: 5px; margin-top: 20px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6; }
    .success { color: #90ee90; }
    .error { color: #ff9999; }
  </style>
</head>
<body>
  <h1>Force Clear Firebase RSVPs</h1>
  <button onclick="forceDelete()">START FORCE DELETE</button>
  <button onclick="checkData()">CHECK DATA</button>
  <div class="log" id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC23EdjuCmwmhR4AQZELE3ojyQEzKUS8KQ",
      authDomain: "erich-enchants.firebaseapp.com",
      databaseURL: "https://erich-enchants-default-rtdb.firebaseio.com",
      projectId: "erich-enchants",
      storageBucket: "erich-enchants.firebasestorage.app",
      messagingSenderId: "717900637787",
      appId: "1:717900637787:web:62aa390acd88d50bd9817e",
      measurementId: "G-YDPSQ4E2HL"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function log(msg, isError = false) {
      const el = document.getElementById('log');
      const span = document.createElement('div');
      span.className = isError ? 'error' : 'success';
      span.textContent = msg;
      el.appendChild(span);
      el.scrollTop = el.scrollHeight;
    }

    function checkData() {
      log('Checking Firebase data...');
      db.ref('rsvps').once('value').then(snapshot => {
        const data = snapshot.val();
        if (!data) {
          log('✓ RSVPs node is empty/null');
        } else {
          log('Found RSVPs: ' + Object.keys(data).length + ' entries');
          Object.keys(data).forEach(key => {
            log('  - ' + key);
          });
        }
      });
    }

    function forceDelete() {
      log('Starting force delete...');

      db.ref('rsvps').once('value').then(snapshot => {
        const data = snapshot.val();
        if (!data) {
          log('✓ No RSVPs found - already empty!');
          return;
        }

        const keys = Object.keys(data);
        log('Found ' + keys.length + ' RSVPs to delete');

        let deleted = 0;
        keys.forEach(key => {
          db.ref('rsvps/' + key).remove().then(() => {
            deleted++;
            log('✓ Deleted: ' + key + ' (' + deleted + '/' + keys.length + ')');

            if (deleted === keys.length) {
              log('---');
              log('✓✓✓ ALL RSVPs DELETED ✓✓✓');
              log('Clearing localStorage...');
              localStorage.removeItem('erich_rsvps');
              localStorage.removeItem('erich_seating');
              log('✓ localStorage cleared');
              log('Go to dashboard and refresh!');
            }
          }).catch(err => {
            log('✗ Error deleting ' + key + ': ' + err.message, true);
          });
        });
      }).catch(err => {
        log('✗ Error reading RSVPs: ' + err.message, true);
      });
    }
  </script>
</body>
</html>
