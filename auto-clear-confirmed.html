<!DOCTYPE html>
<html>
<head>
  <title>Auto Clear Confirmed</title>
</head>
<body>
  <h1>Clearing confirmed RSVPs...</h1>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC23EdjuCmwmhR4AQZELE3ojyQEzKUS8KQ",
      authDomain: "erich-enchants.firebaseapp.com",
      databaseURL: "https://erich-enchants-default-rtdb.firebaseio.com",
      projectId: "erich-enchants",
      storageBucket: "erich-enchants.firebasestorage.app",
      messagingSenderId: "717900637787",
      appId: "1:717900637787:web:62aa390acd88d50bd9817e",
      measurementId: "G-YDPSQ4E2HL"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function log(msg) {
      console.log(msg);
      document.getElementById('log').innerHTML += msg + '<br>';
    }

    // Get all RSVPs
    db.ref('rsvps').once('value', (snapshot) => {
      const data = snapshot.val() || {};
      const rsvps = Object.entries(data);

      log('Found ' + rsvps.length + ' RSVPs');

      let deleted = 0;
      rsvps.forEach(([key, rsvp]) => {
        if (rsvp.attendance === 'yes') {
          db.ref('rsvps/' + key).remove().then(() => {
            deleted++;
            log('✓ Deleted: ' + rsvp.guestName);

            if (deleted === rsvps.filter(([k, r]) => r.attendance === 'yes').length) {
              log('Done! Cleared all confirmed RSVPs.');
              setTimeout(() => {
                window.location.href = '/dashboard.html';
              }, 2000);
            }
          });
        }
      });
    });
  </script>
</body>
</html>
